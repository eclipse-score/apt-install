name: Benchmark

on:
  schedule:
    # Avoid the busy start of the hour. Scheduled jobs may still be delayed.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize history updates so two runs cannot append to the same predecessor.
concurrency:
  group: apt-install-benchmark
  cancel-in-progress: false

jobs:
  measure:
    name: ${{ matrix.method }} / update=${{ matrix.update }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        method: [plain, action-no-cache, cache-miss]
        update: ["false", "true"]
    env:
      METHOD: ${{ matrix.method }}
      APT_UPDATE: ${{ matrix.update }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated cache and instrument action
        run: python3 benchmark/benchmark.py prepare
      - name: Start measurement
        run: python3 benchmark/benchmark.py start
      - name: Install with plain apt
        id: plain
        if: matrix.method == 'plain'
        run: |
          if [[ "$APT_UPDATE" == true ]]; then sudo apt-get update; fi
          sudo apt-get install -y --no-install-recommends graphviz
      - name: Install with action
        id: action
        if: matrix.method != 'plain'
        uses: ./.benchmark-action
        with:
          packages: graphviz
          cache: ${{ matrix.method == 'cache-miss' && 'true' || 'false' }}
          apt_update: ${{ matrix.update }}
          recommends: "false"
      - name: Record duration and verify installation
        if: always()
        env:
          INSTALL_OUTCOME: ${{ matrix.method == 'plain' && steps.plain.outcome || steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PACKAGE_VERSIONS: ${{ steps.action.outputs.package-versions }}
        run: python3 benchmark/benchmark.py record
      - name: Preserve raw measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-raw-${{ matrix.method }}-${{ matrix.update }}
          path: benchmark-result.json
          retention-days: 90
          if-no-files-found: error

  warm-cache:
    name: cache-hit / update=${{ matrix.update }}
    needs: measure
    # Missing seeds are recorded as failed hits, even if another variant failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        update: ["false", "true"]
    env:
      METHOD: cache-hit
      APT_UPDATE: ${{ matrix.update }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated cache and instrument action
        run: python3 benchmark/benchmark.py prepare
      - name: Start measurement
        run: python3 benchmark/benchmark.py start
      - name: Install with action
        id: action
        uses: ./.benchmark-action
        with:
          packages: graphviz
          cache: "true"
          apt_update: ${{ matrix.update }}
          recommends: "false"
      - name: Record duration and verify installation
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PACKAGE_VERSIONS: ${{ steps.action.outputs.package-versions }}
        run: python3 benchmark/benchmark.py record
      - name: Preserve raw measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-raw-cache-hit-${{ matrix.update }}
          path: benchmark-result.json
          retention-days: 90
          if-no-files-found: error

  summary:
    needs: [measure, warm-cache]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-raw-*
          path: measurements
      - name: Carry forward history and summarize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 benchmark/benchmark.py summarize measurements --restore-history
      - name: Preserve cumulative history
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: |
            benchmark-history.json
            benchmark-history.csv
            benchmark-summary.md
          retention-days: 90
